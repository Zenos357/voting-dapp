openapi: 3.0.0
info:
  title: Online Voting & Election System API
  description: Comprehensive REST API for managing elections, candidates, voters, and voting processes.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
    NotFoundError:
      description: The requested resource was not found
    ValidationError:
      description: Invalid input data

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: Login a user
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: Email or voter ID/Username
                password:
                  type: string
      responses:
        '200':
          description: Successfully logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

  /auth/register:
    post:
      summary: Register a new admin/officer (Admin only)
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                password:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
      responses:
        '201':
          description: User created

  /auth/me:
    get:
      summary: Get current logged-in user profile
      tags:
        - Authentication
      responses:
        '200':
          description: User profile data

  /elections:
    get:
      summary: Get all elections
      tags:
        - Elections
      responses:
        '200':
          description: A list of elections
    post:
      summary: Create a new election
      tags:
        - Elections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - startDate
                - endDate
              properties:
                name:
                  type: string
                description:
                  type: string
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Election created

  /elections/{id}:
    get:
      summary: Get an election by ID
      tags:
        - Elections
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election details

  /candidates/election/{electionId}:
    get:
      summary: Get candidates for a specific election
      tags:
        - Candidates
      parameters:
        - in: path
          name: electionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of candidates

  /candidates:
    post:
      summary: Add a candidate
      tags:
        - Candidates
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                electionId:
                  type: string
                positionId:
                  type: string
                photo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Candidate created

  /voters:
    get:
      summary: Get all registered voters
      tags:
        - Voters
      responses:
        '200':
          description: A list of voters

    post:
      summary: Register a new voter
      tags:
        - Voters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - dateOfBirth
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
      responses:
        '201':
          description: Voter registered

  /voting/available-elections:
    get:
      summary: Get available elections for the current voter
      tags:
        - Voting
      responses:
        '200':
          description: Elections available for voting

  /voting/ballot/{electionId}:
    get:
      summary: Get ballot data for an election
      tags:
        - Voting
      parameters:
        - in: path
          name: electionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ballot configuration and candidates

  /voting/cast:
    post:
      summary: Cast a vote
      tags:
        - Voting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - electionId
                - selections
              properties:
                electionId:
                  type: string
                selections:
                  type: array
                  items:
                    type: object
                    properties:
                      positionId:
                        type: string
                      candidateId:
                        type: string
      responses:
        '200':
          description: Vote successfully cast

  /results/{electionId}:
    get:
      summary: Get certified results for an election
      tags:
        - Results
      parameters:
        - in: path
          name: electionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Election results and winners
